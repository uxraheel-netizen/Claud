<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pilot" />
  <title>Pilot</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <div class="hello" id="hello">Hi Raheel</div>
      <div class="sub" id="clock"></div>
    </div>
    <button class="icon-btn" id="notifyBtn" title="Enable reminders" aria-label="Enable reminders">🔔</button>
  </header>

  <main id="view"></main>

  <nav class="tabs" role="tablist">
    <button data-tab="today" class="active"><span>☀️</span>Today</button>
    <button data-tab="team"><span>👥</span>Team</button>
    <button data-tab="bot"><span>💬</span>Bot</button>
    <button data-tab="health"><span>💚</span>Health</button>
    <button data-tab="more"><span>⚙️</span>More</button>
  </nav>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
