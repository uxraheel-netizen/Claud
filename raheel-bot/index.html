<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e7eeea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pilot" />
  <title>Pilot</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preload" href="fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="grow">
      <div class="sub" id="clock"></div>
      <h1 id="title">Today</h1>
    </div>
    <button class="round white" id="notifyBtn" aria-label="Reminders"></button>
    <span class="av grad big" id="meAvatar">R</span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="nav" role="tablist"></nav>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
